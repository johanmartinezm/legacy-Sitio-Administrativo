server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE [1-6]\.";
    gzip_min_length   1100;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level   9;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html no se guarda en caché. Sin cabecera, el navegador calculaba
    # por su cuenta cuánto conservarlo y, tras un despliegue, seguía abriendo
    # el panel anterior un rato (visto el 2026-10-21). Los .js sí pueden
    # guardarse seis meses: llevan un hash en el nombre y cambian con cada build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache Control for static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Associated Domains de la app de iOS (webcredentials): es lo que deja que
    # el iPhone ofrezca guardar la contraseña al entrar en la app y la rellene
    # desde el Llavero. Apple lo descarga de esta ruta exacta, por HTTPS y sin
    # redirecciones. Sin esta regla caía en el try_files de arriba y devolvía
    # el index.html del panel con un 200. El archivo no lleva extensión, así que
    # el tipo hay que fijarlo aquí. Añadido el 2026-11-13.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # Health check for Docker/K8s
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
