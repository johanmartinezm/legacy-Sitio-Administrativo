<div class="reset-container">
    <mat-card class="reset-card">
        <mat-card-header>
            <mat-card-title>Restablecer Contraseña</mat-card-title>
            <mat-card-subtitle>Ingresa tu nueva contraseña para acceder a la cuenta.</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <!--
                Ya no se muestra el correo: dejó de viajar en el enlace a
                propósito, y pedírselo al servidor solo para pintarlo volvería a
                exponerlo. El enlace llega al buzón de su dueño, así que no hace
                falta recordarle de quién es la cuenta.
            -->
            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="token">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nueva Contraseña</mat-label>
                    <input matInput type="password" formControlName="newPassword" placeholder="Mínimo 6 caracteres">
                    <mat-error *ngIf="resetForm.get('newPassword')?.hasError('required')">Requerido</mat-error>
                    <mat-error *ngIf="resetForm.get('newPassword')?.hasError('minlength')">Mínimo 6
                        caracteres</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Confirmar Contraseña</mat-label>
                    <input matInput type="password" formControlName="confirmPassword">
                    <mat-error *ngIf="resetForm.hasError('mismatch')">Las contraseñas no coinciden</mat-error>
                </mat-form-field>

                <div class="actions">
                    <button mat-raised-button color="primary" type="submit" [disabled]="resetForm.invalid || isLoading">
                        {{ isLoading ? 'Restableciendo...' : 'Cambiar Contraseña' }}
                    </button>
                </div>
            </form>

            <div *ngIf="!token" class="error-state">
                <p>El enlace de recuperación no es válido.</p>
                <button mat-button routerLink="/login">Volver al login</button>
            </div>
        </mat-card-content>
    </mat-card>
</div>
