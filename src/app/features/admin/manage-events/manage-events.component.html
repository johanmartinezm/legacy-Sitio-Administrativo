<div class="page-container">
    <div class="page-header">
        <div class="header-text">
            <h1>Administrar Eventos</h1>
            <p>Gestión de eventos del sistema.</p>
        </div>
        <button mat-flat-button color="primary" (click)="createEvent()">
            <mat-icon>add</mat-icon> Crear Evento
        </button>
    </div>

    <div class="page-content">
        <mat-tab-group animationDuration="0ms">
            <mat-tab label="Lista">
                <div class="tab-content-wrapper">
                    <div class="table-container mat-elevation-z2">
                        <table mat-table [dataSource]="events">

                            <!-- Image Column -->
                            <ng-container matColumnDef="image">
                                <th mat-header-cell *matHeaderCellDef> Imagen </th>
                                <td mat-cell *matCellDef="let element">
                                    <div class="img-thumbnail" *ngIf="element.imageUrl">
                                        <img [src]="element.imageUrl" alt="Event"
                                            onerror="this.src='assets/images/logo2.png'">
                                    </div>
                                    <mat-icon *ngIf="!element.imageUrl">image</mat-icon>
                                </td>
                            </ng-container>

                            <!-- Title Column -->
                            <ng-container matColumnDef="title">
                                <th mat-header-cell *matHeaderCellDef> Título </th>
                                <td mat-cell *matCellDef="let element"> {{element.title}} </td>
                            </ng-container>

                            <!-- Description Column -->
                            <ng-container matColumnDef="description">
                                <th mat-header-cell *matHeaderCellDef> Descripción </th>
                                <td mat-cell *matCellDef="let element">
                                    <span class="description-text">{{element.description}}</span>
                                </td>
                            </ng-container>

                            <!-- Workshops Count Column -->
                            <ng-container matColumnDef="workshops">
                                <th mat-header-cell *matHeaderCellDef> Talleres </th>
                                <td mat-cell *matCellDef="let element"> {{element.workshops?.length || 0}} </td>
                            </ng-container>

                            <!-- Actions Column -->
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                                <td mat-cell *matCellDef="let element">
                                    <button mat-icon-button color="accent" (click)="viewFeedback(element)"
                                        matTooltip="Ver Feedback">
                                        <mat-icon style="color: #ffb300;">star</mat-icon>
                                    </button>
                                    <button mat-icon-button color="primary" (click)="editEvent(element)"
                                        matTooltip="Editar">
                                        <mat-icon>edit</mat-icon>
                                    </button>
                                    <button mat-icon-button color="warn" (click)="deleteEvent(element.id)"
                                        matTooltip="Eliminar">
                                        <mat-icon>delete</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                            <!-- Row shown when there is no matching data. -->
                            <tr class="mat-row" *matNoDataRow>
                                <td class="mat-cell" colspan="5">No hay eventos creados aún.</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </mat-tab>

            <mat-tab label="Calendario">
                <ng-template matTabContent>
                    <div class="tab-content-wrapper">
                        <app-calendar-view [events]="events"></app-calendar-view>
                    </div>
                </ng-template>
            </mat-tab>
        </mat-tab-group>
    </div>
</div>
