<div class="forums-container">
  <h2>Moderación de Foros</h2>
  
  <div class="section">
    <h3>Publicaciones Reportadas</h3>
    <table class="table" *ngIf="flaggedPosts.length > 0">
      <thead>
        <tr>
          <th>Contenido</th>
          <th>Autor (Alias)</th>
          <th>Reportes</th>
          <th>Fecha</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let post of flaggedPosts">
          <td style="max-width: 300px; white-space: pre-wrap;">{{ post.content }}</td>
          <td>{{ post.author_alias }}</td>
          <td><strong style="color: red;">{{ post.report_count }}</strong></td>
          <td>{{ post.created_at | date:'short' }}</td>
          <td>
            <button class="btn btn-danger" (click)="deletePost(post.id)">Eliminar Publicación</button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="flaggedPosts.length === 0">No hay publicaciones reportadas en este momento.</p>
  </div>
</div>
