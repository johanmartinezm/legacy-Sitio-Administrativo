<h2 mat-dialog-title>{{ isEditMode ? 'Editar taller' : 'Agregar taller' }}</h2>

<mat-dialog-content class="form-content">
    <form [formGroup]="form">
        <div class="field-grid">
            <mat-form-field appearance="outline">
                <mat-label>Nombre del taller</mat-label>
                <input matInput formControlName="name">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Descripción del taller</mat-label>
                <textarea matInput formControlName="description" rows="1"></textarea>
            </mat-form-field>
        </div>

        <div class="field-grid">
            <mat-form-field appearance="outline">
                <mat-label>Salón / Sala</mat-label>
                <input matInput formControlName="room">
                <mat-icon matSuffix>meeting_room</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Expositor</mat-label>
                <input matInput formControlName="speaker">
                <mat-icon matSuffix>person</mat-icon>
            </mat-form-field>
        </div>

        <app-image-upload formControlName="imageUrl" label="Imagen del taller"
            recomendacion="Horizontal, 600 × 350 px, igual que la del evento. Hoy la app no muestra esta imagen."></app-image-upload>

        <div class="time-grid">
            <mat-form-field appearance="outline">
                <mat-label>Fecha inicio</mat-label>
                <input matInput [matDatepicker]="pickerStart" formControlName="startDate">
                <mat-datepicker-toggle matIconSuffix [for]="pickerStart"></mat-datepicker-toggle>
                <mat-datepicker #pickerStart></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Hora inicio</mat-label>
                <input matInput type="time" formControlName="startTime">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Fecha fin</mat-label>
                <input matInput [matDatepicker]="pickerEnd" formControlName="endDate">
                <mat-datepicker-toggle matIconSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                <mat-datepicker #pickerEnd></mat-datepicker>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Hora fin</mat-label>
                <input matInput type="time" formControlName="endTime">
            </mat-form-field>
        </div>

        <p class="error-horario" *ngIf="form.hasError('finAntesDelInicio')">
            <mat-icon>error_outline</mat-icon> El fin del taller no puede ser anterior a su inicio.
        </p>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="close()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
        <mat-icon>save</mat-icon> Guardar taller
    </button>
</mat-dialog-actions>
