<div class="content-container">
    <div class="header">
        <h1>Gestión de Contenido de Valor</h1>
        <button mat-raised-button color="primary" (click)="openContentDialog()">
            <mat-icon>add</mat-icon>
            Nuevo Contenido
        </button>
    </div>

    <div class="mat-elevation-z8 table-container">
        <table mat-table [dataSource]="contents()">

            <!-- Type Column -->
            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef> Tipo </th>
                <td mat-cell *matCellDef="let element">
                    <mat-icon [color]="element.type === 'video' ? 'warn' : 'primary'">
                        {{ element.type === 'video' ? 'play_circle' : 'article' }}
                    </mat-icon>
                </td>
            </ng-container>

            <!-- Title Column -->
            <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef> Título </th>
                <td mat-cell *matCellDef="let element"> {{element.title}} </td>
            </ng-container>

            <!-- Category Column -->
            <ng-container matColumnDef="category">
                <th mat-header-cell *matHeaderCellDef> Categoría </th>
                <td mat-cell *matCellDef="let element">
                    <mat-chip-set>
                        <mat-chip>{{element.category_name || 'Sin categoría'}}</mat-chip>
                    </mat-chip-set>
                </td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Estado </th>
                <td mat-cell *matCellDef="let element">
                    <span [class.published]="element.is_published" [class.draft]="!element.is_published">
                        {{element.is_published ? 'Publicado' : 'Borrador'}}
                    </span>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="primary" (click)="openContentDialog(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="deleteContent(element)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="displayedColumns; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="5">No hay contenido disponible.</td>
            </tr>
        </table>
    </div>
</div>
