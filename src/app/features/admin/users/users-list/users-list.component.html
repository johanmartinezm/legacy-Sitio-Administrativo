<div class="users-container">
    <div class="header">
        <h1>Administración de Usuarios</h1>
        <button mat-raised-button color="primary" (click)="openUserDialog()">
            <mat-icon>add</mat-icon> Crear Usuario
        </button>
    </div>

    <table mat-table [dataSource]="users()" class="mat-elevation-z8">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let user"> {{user.firstName}} {{user.lastName}} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let user"> {{user.email}} </td>
        </ng-container>

        <!-- Identification Column -->
        <ng-container matColumnDef="identification">
            <th mat-header-cell *matHeaderCellDef> Identificación </th>
            <td mat-cell *matCellDef="let user">
                <span *ngIf="user.identificationType">{{user.identificationType}}: </span>
                {{user.identificationNumber}}
            </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Estado </th>
            <td mat-cell *matCellDef="let user">
                <span class="status-badge" [ngClass]="{'pending': user.customerStatus === 'Quiero ser cliente'}">
                    {{user.customerStatus}}
                </span>
            </td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Rol </th>
            <td mat-cell *matCellDef="let user">
                <span class="role-badge" [ngClass]="user.role">{{user.role}}</span>
            </td>
        </ng-container>

        <!-- Company Column -->
        <ng-container matColumnDef="company">
            <th mat-header-cell *matHeaderCellDef> Empresa / Cargo </th>
            <td mat-cell *matCellDef="let user">
                {{user.companyName}} <span *ngIf="user.jobTitle">({{user.jobTitle}})</span>
            </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let user">
                <button mat-icon-button color="accent" (click)="openUserDialog(user)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteUser(user)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- El paginador va contra el servidor: `length` es el total de cuentas, no
         las de esta página, y cada cambio vuelve a pedir. Por eso no se usa
         MatTableDataSource, que paginaría en memoria lo que ya se trajo. -->
    <mat-paginator
        [length]="total()"
        [pageSize]="tamanoDePagina"
        [pageIndex]="paginaActual"
        [pageSizeOptions]="tamanosDePagina"
        (page)="cambiarPagina($event)"
        aria-label="Páginas de usuarios">
    </mat-paginator>
</div>
