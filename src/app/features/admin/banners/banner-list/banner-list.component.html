<div class="banners-container">
    <div class="header">
        <h1>Gestión de Banners (Carrusel)</h1>
        <button mat-raised-button color="primary" (click)="openBannerDialog()">
            <mat-icon>add</mat-icon> Nuevo Banner
        </button>
    </div>

    <table mat-table [dataSource]="banners()" class="mat-elevation-z8">

        <!-- Image Column -->
        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef> Imagen </th>
            <td mat-cell *matCellDef="let banner">
                <img [src]="banner.image_url" alt="Banner" class="banner-preview">
            </td>
        </ng-container>

        <!-- Title Column -->
        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> Título </th>
            <td mat-cell *matCellDef="let banner">
                <strong>{{banner.title}}</strong>
                <div class="subtitle">{{banner.subtitle}}</div>
            </td>
        </ng-container>

        <!-- Category Column -->
        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef> Ubicación </th>
            <td mat-cell *matCellDef="let banner">
                <span class="category-badge" [ngClass]="banner.category">
                    {{banner.category === 'home' ? 'Inicio' : 'Comunidad'}}
                </span>
            </td>
        </ng-container>

        <!-- Order Column -->
        <ng-container matColumnDef="order">
            <th mat-header-cell *matHeaderCellDef> Orden </th>
            <td mat-cell *matCellDef="let banner"> {{banner.sort_order}} </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Estado </th>
            <td mat-cell *matCellDef="let banner">
                <span class="status-badge" [ngClass]="{'active': banner.is_active, 'inactive': !banner.is_active}">
                    {{banner.is_active ? 'Activo' : 'Inactivo'}}
                </span>
            </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let banner">
                <button mat-icon-button color="accent" (click)="openBannerDialog(banner)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteBanner(banner)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
